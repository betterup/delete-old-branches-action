name: Delete Stale Branches (Parallelized)

on:
  workflow_dispatch:
  schedule:
    # Runs nightly at 2:30 AM UTC
    - cron: '30 2 * * *'

# Allow only one concurrent run to avoid conflicts
concurrency:
  group: delete-stale-branches
  cancel-in-progress: false

jobs:
  # Stage 1: Discovery - List all branches and create batches
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Discover branches and create batches
        id: discover
        uses: betterup/delete-old-branches-action/discovery@v0.0.18
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          batch_size: "100"

  # Stage 2: Process - Delete stale branches in parallel
  process:
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      deleted_branches: ${{ steps.delete.outputs.deleted_branches }}
      deleted_count: ${{ steps.delete.outputs.deleted_count }}
      error_branches: ${{ steps.delete.outputs.error_branches }}
      error_count: ${{ steps.delete.outputs.error_count }}
    # This job will run once for each batch
    strategy:
      # Allow up to 10 parallel jobs
      max-parallel: 10
      # Don't cancel other jobs if one fails
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete stale branches (Batch ${{ matrix.batch }})
        id: delete
        uses: betterup/delete-old-branches-action@v0.0.18
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          date: "60 days ago"
          dry_run: false
          exclude_open_pr_branches: true
          extra_protected_branch_regex: "^(main|staging|production|gov-|gh-pages|release/.*)$"
          branch_list: ${{ matrix.branches }}

      - name: Report results for batch ${{ matrix.batch }}
        if: always()
        run: |
          echo "✅ Batch ${{ matrix.batch }}: Processed ${{ matrix.count }} branches"
          echo "Deleted branches (${{ steps.delete.outputs.deleted_count }}): ${{ steps.delete.outputs.deleted_branches }}"
          echo "Branches with errors (${{ steps.delete.outputs.error_count }}): ${{ steps.delete.outputs.error_branches }}"

  # Stage 3: Summary - Aggregate results from all batches
  summary:
    needs: process
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate and display results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all job results from the workflow run using GitHub API
          run_id="${{ github.run_id }}"

          # Get all jobs in this workflow run
          jobs_json=$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}/jobs" --jq '.jobs')

          # Extract results from all "process" jobs (matrix jobs)
          all_deleted=""
          all_errors=""
          total_deleted=0
          total_errors=0

          # Parse job logs to extract deletion results
          # Each process job reports: "Deleted branches (N): branch1 branch2..."
          while IFS= read -r job_id; do
            job_logs=$(gh api "repos/${{ github.repository }}/actions/jobs/${job_id}/logs" 2>/dev/null || echo "")

            # Extract deleted branches from log output and trim whitespace
            deleted=$(echo "$job_logs" | grep -oP "Deleted branches \(\d+\): \K.*" | tr -d '\n\r')
            deleted=$(echo "$deleted" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -n "$deleted" ]; then
              all_deleted="$all_deleted $deleted"
              count=$(echo "$deleted" | wc -w | tr -d ' ')
              total_deleted=$((total_deleted + count))
            fi

            # Extract error branches from log output and trim whitespace
            errors=$(echo "$job_logs" | grep -oP "Branches with errors \(\d+\): \K.*" | tr -d '\n\r')
            errors=$(echo "$errors" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -n "$errors" ]; then
              all_errors="$all_errors $errors"
              count=$(echo "$errors" | wc -w | tr -d ' ')
              total_errors=$((total_errors + count))
            fi
          done < <(echo "$jobs_json" | jq -r '.[] | select(.name | startswith("process")) | .id')

          # Generate summary
          {
            echo "## 🎯 Deletion Summary"
            echo ""
            echo "### ✅ Successfully Deleted: $total_deleted"
            if [ "$total_deleted" -gt 0 ]; then
              echo '```'
              echo "$all_deleted" | tr ' ' '\n' | sort -u
              echo '```'
            else
              echo "*No branches were deleted*"
            fi
            echo ""
            echo "### ❌ Errors: $total_errors"
            if [ "$total_errors" -gt 0 ]; then
              echo '```'
              echo "$all_errors" | tr ' ' '\n' | sort -u
              echo '```'
            else
              echo "*No errors*"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
